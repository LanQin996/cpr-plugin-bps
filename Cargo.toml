[package]
name = "cpr-plugin-bps"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "9b4a042be5c96e66e635d5af76047e9e3cbee462", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["io-std", "macros", "rt", "time"] }
url = "2.5.8"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4"] }
jsonschema = { version = "0.33", default-features = false }
time = { version = "0.3", features = ["parsing", "formatting"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["io-util", "process", "sync", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
